<!doctype html>
<!--
  App Store creative assets (product page header and search results).
  Rendered with headless Chrome by render.sh: asset.html?kind=header|search&lang=en|de|fr|es|it
  Add &safe=1 to draw Apple's art safe area from the official templates.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --deep: #041416;
    --teal: #17494d;
    --ink-top: #e6fbfc;
    --ink-bottom: #6fc1c5;
    --glow: #7ee0e5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--deep); }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; color: #fff; position: relative; }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 75% at 50% var(--glow-y), rgba(126, 224, 229, 0.30), rgba(126, 224, 229, 0) 70%),
      radial-gradient(ellipse 90% 90% at 50% 120%, #17494d 0%, rgba(23, 73, 77, 0) 70%),
      linear-gradient(180deg, #0a2629 0%, #041416 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(170, 235, 238, 0.16) 2.2px, transparent 2.6px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 55% 70% at 50% var(--glow-y), #000 0%, transparent 75%);
  }
  svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; }

  .headline {
    font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; white-space: nowrap; max-width: 100%;
    background: linear-gradient(180deg, var(--ink-top) 10%, var(--ink-bottom) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 30px rgba(0, 0, 0, 0.35));
  }
  .chips { display: flex; gap: 0.4em; flex-wrap: nowrap; max-width: 100%; }
  .chip {
    font-weight: 600; letter-spacing: -0.01em; white-space: nowrap;
    padding: 0.38em 0.85em; border-radius: 999px;
    color: #dff6f7; background: rgba(126, 224, 229, 0.12);
    border: 2px solid rgba(126, 224, 229, 0.35);
    backdrop-filter: blur(8px);
  }

  .phone {
    position: absolute; width: var(--pw); aspect-ratio: 1206 / 2622;
    padding: calc(var(--pw) * 0.035); border-radius: calc(var(--pw) * 0.16);
    background: linear-gradient(145deg, #3b4b4d, #0d1516 40%, #1d2a2c);
    box-shadow:
      0 0 0 calc(var(--pw) * 0.006) rgba(255, 255, 255, 0.18) inset,
      0 calc(var(--pw) * 0.08) calc(var(--pw) * 0.2) rgba(0, 0, 0, 0.55),
      0 0 calc(var(--pw) * 0.3) rgba(126, 224, 229, 0.18);
  }
  .phone img { display: block; width: 100%; height: 100%; border-radius: calc(var(--pw) * 0.128); }
  .phone::after { /* Dynamic Island */
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--pw) * 0.062); width: calc(var(--pw) * 0.3); height: calc(var(--pw) * 0.088);
    border-radius: 999px; background: #000;
  }

  .safe { position: absolute; outline: 6px dashed #00ff00; background: rgba(0, 255, 0, 0.08); display: none; }
  body.show-safe .safe { display: block; }

  /* Header: 3840 x 1646, safe area x 1098-2742, y 494-1152 */
  body.header { --w: 3840px; --h: 1646px; --glow-y: 62%; }
  body.header .copy {
    position: absolute; left: 1098px; width: 1644px; top: 494px; height: 658px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; text-align: center;
  }
  body.header .headline { font-size: 150px; }
  body.header .chips { font-size: 50px; }

  /* Search results: 3840 x 2560, safe area x 836-3002, y 766-1794 */
  body.search { --w: 3840px; --h: 2560px; --glow-y: 50%; }
  body.search .copy {
    position: absolute; left: 836px; width: 1150px; top: 766px; height: 1028px;
    display: flex; flex-direction: column; justify-content: center; gap: 64px;
  }
  body.search .headline { font-size: 150px; }
  body.search .chips { font-size: 48px; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<svg class="rings" id="rings"></svg>
<div id="phones"></div>
<div class="copy">
  <h1 class="headline" id="headline"></h1>
  <div class="chips" id="chips"></div>
</div>
<div class="safe" id="safe"></div>
<script>
  const params = new URLSearchParams(location.search);
  const kind = params.get("kind") || "header";
  const lang = params.get("lang") || "en";
  // Store screenshots exist only in English and German; the others show the English app.
  const shotLang = lang === "de" ? "de" : "en";

  const copy = {
    en: { header: "See your network<br>clearly.", search: "Network status<br>&amp; ping tools.",
          chips: ["Wi-Fi", "Cellular", "VPN", "DNS", "LAN"] },
    de: { header: "Dein Netzwerk<br>auf einen Blick.", search: "Netzwerkstatus<br>&amp; Ping-Tools.",
          chips: ["WLAN", "Mobilfunk", "VPN", "DNS", "LAN"] },
    fr: { header: "Votre réseau<br>en un coup d’œil.", search: "État du réseau<br>et outils ping.",
          chips: ["Wi-Fi", "Cellulaire", "VPN", "DNS", "LAN"] },
    es: { header: "Tu red<br>de un vistazo.", search: "Estado de la red<br>y herramientas ping.",
          chips: ["Wi-Fi", "Móvil", "VPN", "DNS", "LAN"] },
    it: { header: "La tua rete<br>in un colpo d’occhio.", search: "Stato della rete<br>e strumenti ping.",
          chips: ["Wi-Fi", "Cellulare", "VPN", "DNS", "LAN"] },
  }[lang];

  document.body.classList.add(kind);
  if (params.get("safe")) document.body.classList.add("show-safe");
  document.getElementById("headline").innerHTML = copy[kind];
  document.getElementById("chips").innerHTML = copy.chips.map(c => `<span class="chip">${c}</span>`).join("");

  const W = 3840, H = kind === "header" ? 1646 : 2560;
  const safe = kind === "header" ? [1098, 494, 2742, 1152] : [836, 766, 3002, 1794];
  Object.assign(document.getElementById("safe").style, {
    left: safe[0] + "px", top: safe[1] + "px", width: (safe[2] - safe[0]) + "px", height: (safe[3] - safe[1]) + "px" });

  // Ping rings, drawn like the arcs of the app icon around one centre point.
  const [cx, cy] = kind === "header" ? [1920, 1500] : [2560, 2350];
  const rings = document.getElementById("rings");
  rings.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let svg = `<defs><linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f7f8"/><stop offset="1" stop-color="#6fc1c5"/></linearGradient></defs>`;
  const radii = kind === "header" ? [260, 520, 800, 1100, 1420, 1760] : [300, 620, 960, 1320, 1700, 2100];
  radii.forEach((r, i) => {
    const op = Math.max(0.05, 0.42 - i * 0.07);
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#ink)" stroke-width="${10 - i}" opacity="${op}"/>`;
  });
  svg += `<defs><radialGradient id="dot"><stop offset="0" stop-color="#7ee0e5" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#7ee0e5" stop-opacity="0"/></radialGradient></defs>
          <circle cx="${cx}" cy="${cy}" r="200" fill="url(#dot)"/>
          <circle cx="${cx}" cy="${cy}" r="38" fill="url(#ink)" opacity="0.85"/>`;
  rings.innerHTML = svg;

  const shot = n => `../../Screenshots/iPhone-6.3/${shotLang}/${n}.png`;
  const phones = kind === "header"
    // Decorative flanks outside the safe area; on narrow crops only the copy remains.
    ? [ { n: "04-lan", x: 220, y: 330, w: 560, r: -9 },
        { n: "01-overview", x: 3060, y: 300, w: 560, r: 9 } ]
    : [ { n: "06-tools", x: 2030, y: 760, w: 560, r: -7 },
        { n: "04-lan", x: 2850, y: 760, w: 560, r: 7 },
        { n: "01-overview", x: 2420, y: 620, w: 620, r: 0 } ];
  document.getElementById("phones").innerHTML = phones.map(p =>
    `<div class="phone" style="--pw:${p.w}px; left:${p.x}px; top:${p.y}px; transform: rotate(${p.r}deg)">
       <img src="${shot(p.n)}"></div>`).join("");

  // Shrink headline and chips until they fit the safe area width (longer languages).
  for (const el of document.querySelectorAll(".headline, .chips")) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && size > 30) {
      size -= 2;
      el.style.fontSize = size + "px";
    }
  }
</script>
</body>
</html>
