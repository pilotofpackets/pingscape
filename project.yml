name: Pingscape

options:
  bundleIdPrefix: app.pingscape
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  NetKit:
    path: Packages/NetKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    # Fallback only: scripts/set-build-number.sh writes the commit count at build time.
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Pingscape:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: NetKit
      - target: PingscapeWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pingscape.ios
        PRODUCT_NAME: Pingscape
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        # The build number script reads .git, which the sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Set build number from git
        script: '"${SRCROOT}/scripts/set-build-number.sh"'
        # Naming the processed Info.plist as input makes Xcode run the script after
        # that file is written. Without it the order is a race, and the extension
        # kept build number 1 while the app got the commit count.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
      - name: Check build numbers of extensions
        script: '"${SRCROOT}/scripts/check-build-numbers.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pingscape
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de, fr, es, it]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSLocationWhenInUseUsageDescription: Pingscape reads the name of your Wi-Fi network, which iOS only allows with location permission. Your location is not used or stored.
        # Plain HTTP only to local addresses (a router's web page, the UPnP
        # description) and to Apple's captive portal probe, which has no HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            captive.apple.com:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Pingscape looks for devices on your local network so it can list them. Results stay on your device.
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
          - _airplay._tcp
          - _raop._tcp
          - _hap._tcp
          - _googlecast._tcp
          - _ipp._tcp
          - _ipps._tcp
          - _printer._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _ssh._tcp
          - _sftp-ssh._tcp
          - _companion-link._tcp
          - _device-info._tcp
          - _workstation._tcp
          - _matter._tcp
          - _meshcop._udp
          - _spotify-connect._tcp
          - _sonos._tcp
    entitlements:
      path: App/Pingscape.entitlements
      properties:
        com.apple.developer.networking.wifi-info: true

  PingscapeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - package: NetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pingscape.ios.widgets
        PRODUCT_NAME: PingscapeWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # The build number script reads .git, which the sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # An extension must carry the same build number as the app that embeds it.
    postBuildScripts:
      - name: Set build number from git
        script: '"${SRCROOT}/scripts/set-build-number.sh"'
        # Naming the processed Info.plist as input makes Xcode run the script after
        # that file is written. Without it the order is a race, and the extension
        # kept build number 1 while the app got the commit count.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pingscape
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de, fr, es, it]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Pingscape:
    build:
      targets:
        Pingscape: all
    run:
      config: Debug
    archive:
      config: Release
